name: Maven Build and Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TVBROWSER_VERSION: 4.2.7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v3.1.11

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Cache TV-Browser package
        id: tvb_cache
        uses: actions/cache@v4
        with:
          path: tvbrowser.jar
          key: tvbrowser-${{ env.TVBROWSER_VERSION }}

      - name: Download and extract TV-Browser
        if: steps.tvb_cache.outputs.cache-hit != 'true'
        run: |
          wget -q -O deb-package.deb "https://sourceforge.net/projects/tvbrowser/files/TV-Browser%20Releases%20%28Java%2011%20and%20higher%29/${TVBROWSER_VERSION}/tvbrowser_${TVBROWSER_VERSION}-1_all.deb/download"
          dpkg-deb -x deb-package.deb tvb-extract
          cp tvb-extract/usr/share/tvbrowser/tvbrowser.jar tvbrowser.jar

      - name: Import TV-Browser JAR to local Maven repository
        run: >
          mvn -B -q install:install-file
          -Dfile=tvbrowser.jar
          -DgroupId=tvbrowser
          -DartifactId=core
          -Dversion=${TVBROWSER_VERSION}
          -Dpackaging=jar

      - name: Set version in pom.xml
        run: sed -i "s/project_version/${{ steps.version_step.outputs.legacySemVer }}/g" pom.xml

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: target/TvHBrowser.jar
          if-no-files-found: error

      - name: Create or update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_step.outputs.legacySemVer }}
          name: Release v${{ steps.version_step.outputs.legacySemVer }}
          files: target/TvHBrowser.jar
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
